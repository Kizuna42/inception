name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  static:
    name: Static checks and verifier tests
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Verifier unit tests
        run: python3 -m unittest discover -s tests -p 'test_*.py' -v

      - name: Shell syntax and ShellCheck
        run: |
          for script in srcs/requirements/*/tools/*.sh; do
            sh -n "$script"
          done
          shellcheck -S warning srcs/requirements/*/tools/*.sh

      - name: Generate throwaway secrets
        run: make secrets

      - name: Compose configuration
        run: docker compose -f srcs/docker-compose.yml config --quiet

      - name: Source verifier on this commit
        run: |
          python3 scripts/verify-current.py \
            --repo "$GITHUB_WORKSPACE" \
            --expected-sha "$(git rev-parse HEAD)" \
            --output "$RUNNER_TEMP/verify-source" \
            --validate-compose

  e2e:
    name: Build, start and probe the stack
    runs-on: ubuntu-24.04
    needs: static
    timeout-minutes: 30
    env:
      DATA_PATH: /tmp/inception-data
      DOMAIN: kishino.42.fr
    steps:
      - uses: actions/checkout@v5

      - name: Build and start (make up)
        run: make up DATA_PATH="$DATA_PATH"

      - name: Wait for healthy services
        run: |
          for i in $(seq 1 60); do
            states=$(docker inspect --format '{{.Name}} {{.State.Status}} {{if .State.Health}}{{.State.Health.Status}}{{end}}' mariadb wordpress nginx)
            echo "$states"
            if [ "$(echo "$states" | grep -c ' running healthy')" -eq 2 ] \
              && echo "$states" | grep -q '^/nginx running'; then
              exit 0
            fi
            sleep 5
          done
          docker compose -f srcs/docker-compose.yml logs
          exit 1

      - name: Probe HTTPS, TLS policy and exposed ports
        run: |
          set -eu
          probe() {
            curl -sk --resolve "$DOMAIN:443:127.0.0.1" -o /dev/null -w '%{http_code}' "$@"
          }
          code=""
          for i in $(seq 1 30); do
            code=$(probe "https://$DOMAIN/" || true)
            [ "$code" = 200 ] && break
            sleep 2
          done
          echo "GET / -> $code"
          test "$code" = 200
          curl -sk --resolve "$DOMAIN:443:127.0.0.1" "https://$DOMAIN/" | grep -qi 'wordpress\|wp-content'
          code=$(probe "https://$DOMAIN/wp-login.php")
          echo "GET /wp-login.php -> $code"
          test "$code" = 200
          # TLS 1.2 and 1.3 are accepted; TLS 1.1 and 1.0 are rejected.
          probe --tlsv1.2 --tls-max 1.2 "https://$DOMAIN/" >/dev/null
          probe --tlsv1.3 "https://$DOMAIN/" >/dev/null
          # OpenSSL 3 refuses to offer TLS <= 1.1 at the default security level and
          # fails locally ("no protocols available"), so lower it to make the client
          # really send the old ClientHello; only a server refusal then counts.
          sclient() {
            openssl s_client -connect 127.0.0.1:443 -servername "$DOMAIN" \
              -cipher 'DEFAULT:@SECLEVEL=0' "$@" </dev/null 2>&1
          }
          # Positive control: the same call must complete a TLS 1.2 handshake
          # (exit 0 and a negotiated cipher), not just print the attempted version.
          if ! out=$(sclient -tls1_2) \
            || ! echo "$out" | grep -Eq '^New, TLSv1\.2, Cipher is [A-Z0-9]'; then
            echo "$out" >&2
            echo "TLS 1.2 control handshake did not complete; the checks below would be meaningless" >&2
            exit 1
          fi
          for proto in -tls1 -tls1_1; do
            if out=$(sclient "$proto"); then
              echo "$proto unexpectedly accepted" >&2
              exit 1
            fi
            # Only a protocol_version alert from the server counts as a refusal;
            # client-side errors (unknown option, no protocols available, ...) fail.
            if ! echo "$out" | grep -q 'alert protocol version'; then
              echo "$out" >&2
              echo "$proto failed without a protocol_version alert from the server" >&2
              exit 1
            fi
            echo "$proto refused by the server"
          done
          # Only 443 is published to the host.
          docker compose -f srcs/docker-compose.yml ps --format '{{.Service}} {{.Publishers}}'
          docker port nginx
          test "$(docker port nginx | awk '{print $1}' | sort -u)" = "443/tcp"
          test -z "$(docker port nginx | awk '{print $3}' | grep -v ':443$' || true)"
          test -z "$(docker port wordpress)"
          test -z "$(docker port mariadb)"
          if curl -s -o /dev/null --max-time 5 http://127.0.0.1:80/; then
            echo "port 80 unexpectedly reachable" >&2
            exit 1
          fi

      - name: WordPress users and persistence across restart
        run: |
          set -eu
          wpcli() {
            docker exec wordpress wp --allow-root --path=/var/www/html "$@"
          }
          # IDs and registration times change on a reinstall, unlike the logins
          # that the entrypoints recreate from srcs/.env.
          users() {
            wpcli user list --fields=ID,user_login,user_registered --format=csv | sort
          }
          before=$(users)
          echo "users: $before"
          echo "$before" | grep -q ',kishino,'
          echo "$before" | grep -q ',guest,'
          # A marker post only survives if the database itself was persisted.
          marker="ci-persistence-${GITHUB_RUN_ID:-local}-$(date +%s)"
          post_id=$(wpcli post create --post_title="$marker" --post_status=publish --porcelain)
          echo "marker post $post_id: $marker"
          make down
          make up DATA_PATH="$DATA_PATH"
          for i in $(seq 1 60); do
            [ "$(docker inspect --format '{{.State.Health.Status}}' wordpress)" = healthy ] && break
            sleep 5
          done
          after=$(users)
          echo "users after restart: $after"
          test "$before" = "$after"
          test "$(wpcli post get "$post_id" --field=post_title)" = "$marker"

      - name: Logs on failure
        if: failure()
        run: docker compose -f srcs/docker-compose.yml logs --no-color || true

      - name: Tear down (make fclean)
        if: always()
        run: make fclean DATA_PATH="$DATA_PATH" || true
