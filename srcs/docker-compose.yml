name: inception

services:
  mariadb:
    build: ./requirements/mariadb
    # An explicit image name prevents Compose from assigning an implicit latest tag.
    image: mariadb:kishino
    container_name: mariadb
    restart: always
    networks: [inception]
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
    secrets: [db_root_password, db_password]
    volumes:
      - mariadb_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mariadb-admin", "ping", "--silent"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 30s

  wordpress:
    build: ./requirements/wordpress
    # Keep the evaluated image tag deterministic for defense and cleanup.
    image: wordpress:kishino
    container_name: wordpress
    restart: always
    networks: [inception]
    environment:
      DOMAIN_NAME: ${DOMAIN_NAME}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      WP_TITLE: ${WP_TITLE}
      WP_ADMIN_USER: ${WP_ADMIN_USER}
      WP_ADMIN_EMAIL: ${WP_ADMIN_EMAIL}
      WP_USER: ${WP_USER}
      WP_USER_EMAIL: ${WP_USER_EMAIL}
    secrets: [db_password, credentials]
    volumes:
      - wordpress_data:/var/www/html
    depends_on:
      mariadb:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "grep -q ':2328 .* 0A ' /proc/net/tcp /proc/net/tcp6"]
      interval: 2s
      timeout: 2s
      retries: 30
      start_period: 5s

  nginx:
    build: ./requirements/nginx
    # The service image is named explicitly instead of receiving latest.
    image: nginx:kishino
    container_name: nginx
    restart: always
    networks: [inception]
    ports: ["443:443"]
    volumes:
      - wordpress_data:/var/www/html:ro
    depends_on:
      wordpress:
        condition: service_healthy

networks:
  inception:
    name: inception
    driver: bridge

volumes:
  # Named volumes with local bind options keep Compose ownership and the required host path.
  mariadb_data:
    name: mariadb_data
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ${DATA_PATH}/mariadb
  wordpress_data:
    name: wordpress_data
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ${DATA_PATH}/wordpress

secrets:
  db_root_password:
    file: ../secrets/db_root_password.txt
  db_password:
    file: ../secrets/db_password.txt
  credentials:
    file: ../secrets/credentials.txt
